[package]
name = "block-editor-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Prueba de viabilidad: editar markdown por bloques, ya pintado, sobre el GPUI de desktop/"

# Fuera de cualquier workspace: es una prueba suelta.
[workspace]

[dependencies]
# Las mismas versiones exactas que `desktop/` (su Cargo.lock se copió aquí).
gpui-kit = "=0.9.1"
# El parser de markdown que ya trae GPUI Kit por dentro (markdown-rs): no se
# añade nada al árbol de dependencias de la app.
markdown = "=1.0.0"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

[profile.release]
debug = false

[package]
name = "cac-core"
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "La lógica de cac que comparten todas sus apps, sin interfaz"
edition = "2021"
publish = false

# Aquí no entra nada que pinte ni nada de una plataforma concreta: este crate lo
# consumen el escritorio (Tauri hoy), Android e iOS (por UniFFI) y el MCP. Lo
# que es propio de cada sitio —dónde se guarda un token, cómo se avisa a la
# pantalla— entra por un trait que implementa quien lo usa.
# Guardián: `tests::the_core_depends_on_no_ui`.
[dependencies]
# Las mismas features que usa la app, para que Cargo compile reqwest una vez.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# Fechas. `chrono-tz` lleva la base de zonas dentro: «hoy» en la zona de una
# organización no puede depender de qué zonas conozca cada teléfono.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Para buscar sin acentos: «revision» encuentra «Revisión».
unicode-normalization = "0.1"
# Los bindings de Kotlin y Swift. Opcional: el escritorio no lo necesita, y
# sin la feature no se compila. Todavía no se generan bindings; la feature
# existe para que el CI compruebe que los tipos del core se pueden exportar
# (`cargo check --features uniffi`), antes de que haga falta en Android.
uniffi = { version = "0.29", optional = true }

[features]
uniffi = ["dep:uniffi"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
wiremock = "0.6"
# El proxy que retiene respuestas hasta que la prueba lo dice
# (`tests/support/gated.rs`). Los mismos que ya trae wiremock.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

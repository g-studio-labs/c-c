# En Windows, la biblioteca de C va dentro del `.exe`, como en `desktop/`.
#
# Sin esto `cac-mcp.exe` pide `vcruntime140.dll`, que no viene con Windows: en
# una máquina sin el «Visual C++ Redistributable» no arranca, y un binario que
# se instala con una línea no puede pedir instalar otra cosa antes.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

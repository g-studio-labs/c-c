[package]
name = "cac-desktop"
version = "0.1.3"
license = "AGPL-3.0-or-later"
description = "cac de escritorio, nativo: la interfaz en GPUI sobre cac-core"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
# La lógica. Aquí no se decide nada: toda regla va al core con su prueba.
cac-core = { path = "../core" }
# Sólo `cac_mcp::update`: instalar y actualizar el binario `cac-mcp` con la
# misma lógica que `cac-mcp update` y que `scripts/install-mcp.sh`, en vez de
# una copia. El servidor MCP no corre dentro de esta app.
cac-mcp = { path = "../mcp" }
# Lo que Plataforma hace en esta máquina (el agente SSH, el llavero), el
# mismo código que usa la app de Tauri.
cac-ops = { path = "../ops" }
# GPUI y sus componentes. Versión **exacta**: cada release puede cambiar la API
# de GPUI por debajo (su propio manifiesto lo avisa), así que subirla es una
# tarea aparte, no algo que pasa con un `cargo update`.
gpui-kit = "=0.9.1"
# El core habla con el servidor sobre tokio, y GPUI tiene su propio ejecutor:
# el escritorio le pone al core un runtime aparte (ver `backend.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# El tono de los avisos (`sound.rs`). La misma que la voz de la app de Tauri,
# sin más: las muestras las calcula el core, no hay nada que decodificar. En
# Linux habla ALSA (`libasound`, que el paquete pide solo con `$auto`).
cpal = "0.18.2"
# Para oír a GPUI: qué tarjeta elige, con qué pinta. Sin un `log` instalado en
# el proceso esas líneas se tiran.
log = "0.4"
# Las variables de un servidor en el panel de provisioning se editan también
# como JSON. Ya venía con el core.
serde_json = "1"
# Los idiomas que el usuario eligió en macOS y en Windows, donde abrir la app
# desde el Finder o el Explorador no deja ninguna variable `LANG` que leer.
# Versión exacta, MIT o Apache-2.0, sin dependencias en ninguno de los tres
# sistemas (habla con CoreFoundation y con Win32 por su cuenta). Ya estaba en
# el `Cargo.lock`: la trae el motor de texto con el que GPUI pinta en Linux.
sys-locale = "=0.3.2"
# Sólo para darle un día al selector de fecha de GPUI Kit, que lo pide con
# este tipo. Qué día es lo dice el core.
chrono = { version = "0.4", default-features = false }
# Sólo para leer el PNG del icono de la ventana: GPUI lo pide ya descodificado.
# Es la misma versión que ya trae GPUI; aquí no se añade nada al binario.
image = { version = "0.25", default-features = false, features = ["png"] }

# El icono y los datos del `.exe` (ver `build.rs`). Sólo existe en Windows.
# El motor de voz (LiveKit 0.12 y cpal), sólo en Linux por ahora: macOS y
# Windows se abren en la fase de empaquetar las llamadas
# (command-and-control-426). Allí el core contesta que esta app todavía no
# tiene llamadas. Trae libwebrtc precompilada, que se descarga al compilar.
[target.'cfg(target_os = "linux")'.dependencies]
cac-voice = { path = "../voice" }

# La instancia única (`single_instance.rs`): quién está al otro lado de su
# socket (`SO_PEERCRED`, `getpeereid`). Ya estaba en el `Cargo.lock`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# El `.deb`, con `cargo deb` (cargo-deb): lee esto y no necesita ni `dpkg` ni
# ser root, así que sale igual en el CI que en una máquina que no es Debian.
# El nombre del lanzador y de los iconos es el identificador de la app
# (`packaging/identity.env`); aquí va repetido porque cargo-deb no sabe leerlo
# de otro sitio, y `identity::tests` falla si deja de coincidir.
[package.metadata.deb]
name = "cac-desktop"
# El contacto que jose dio para los paquetes (17-nov-2026).
maintainer = "G Studio <jose@guz-studio.dev>"
section = "office"
priority = "optional"
extended-description = "Cliente de escritorio nativo de cac (CAC Nativa). Convive con la app anterior: guarda su sesión y sus datos en una carpeta propia."
# `$auto` son las bibliotecas que el binario enlaza (libc, xcb, xkbcommon), tal
# como las llama la distribución donde se empaqueta; van también a mano porque
# fuera de Debian no hay `dpkg-shlibdeps` que las calcule. Vulkan y Wayland las
# abre GPUI en marcha (`dlopen`), así que ningún análisis del binario las ve:
# sin Vulkan no hay ventana. Lo recomendado es lo que usa si está: el camino
# de reserva por OpenGL, y `xdg-open`/el portal para abrir enlaces.
depends = "$auto, libvulkan1, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libxcb1"
recommends = "mesa-vulkan-drivers, libwayland-egl1, libegl1, xdg-utils, xdg-desktop-portal"
maintainer-scripts = "packaging/linux/debian"
assets = [
    ["target/release/cac-desktop", "usr/bin/", "755"],
    ["packaging/linux/dev.guz-studio.cac.native.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/dev.guz-studio.cac.native.png", "644"],
    ["packaging/icons/64x64.png", "usr/share/icons/hicolor/64x64/apps/dev.guz-studio.cac.native.png", "644"],
    ["packaging/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/dev.guz-studio.cac.native.png", "644"],
    ["packaging/icons/256x256.png", "usr/share/icons/hicolor/256x256/apps/dev.guz-studio.cac.native.png", "644"],
    ["packaging/icons/512x512.png", "usr/share/icons/hicolor/512x512/apps/dev.guz-studio.cac.native.png", "644"],
    # Las tipografías van dentro del binario y su licencia (OFL) pide ir con ellas.
    ["assets/fonts/LICENSE-*.txt", "usr/share/doc/cac-desktop/licenses/", "644"],
]

[dev-dependencies]
# El arnés de pruebas de GPUI: ventanas sin pantalla, clics y teclado de verdad.
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
# Leer las tipografías que van dentro del binario (qué cubren y cómo se
# llaman). Ya estaba en el árbol por el motor de texto de GPUI.
ttf-parser = "=0.25.1"
# Para fabricar una sesión de prueba.
serde_json = "1"
# El servidor de mentira de las pruebas de pantalla, el mismo que usa el core.
wiremock = "0.6"
# El proxy que retiene respuestas hasta que la prueba lo dice, el mismo que
# usan las pruebas del core (`core/tests/support/gated.rs`).
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["net"] }

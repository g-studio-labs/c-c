---
# Comprueba la caja de compilación: que cede ante todo, que no tiene llave del
# API, que su techo es el acordado y que desde su namespace no se llega a nada
# de cac pero sí a internet. Lo de la red se prueba con un pod de verdad (se
# borra solo): una política que no se aplica no da ningún error. No enciende
# la caja: apagada también pasa.
- name: Verificar la caja de compilación
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  tasks:
    - name: La caja cede ante todo y no lleva llave del API
      ansible.builtin.shell:
        cmd: >-
          kubectl -n build get statefulset rust-box
          -o jsonpath='{.spec.template.spec.priorityClassName} {.spec.template.spec.automountServiceAccountToken} {.spec.template.spec.containers[0].securityContext.privileged}'
      register: box
      changed_when: false
      check_mode: false
      failed_when: box.rc != 0 or box.stdout != 'build-low false '

    - name: Los huérfanos los recoge el pause del pod, no un sleep
      ansible.builtin.shell:
        cmd: kubectl -n build get statefulset rust-box -o jsonpath='{.spec.template.spec.shareProcessNamespace}'
      register: reaper
      changed_when: false
      check_mode: false
      failed_when: reaper.rc != 0 or reaper.stdout != 'true'

    - name: La prioridad es negativa y no desaloja
      ansible.builtin.shell:
        cmd: kubectl get priorityclass build-low -o jsonpath='{.value} {.preemptionPolicy}'
      register: prio
      changed_when: false
      check_mode: false
      failed_when: prio.rc != 0 or prio.stdout != '-100 Never'

    - name: El apagado sólo puede leer y escalar la caja
      ansible.builtin.shell:
        cmd: >-
          kubectl auth can-i --list --as=system:serviceaccount:build:rust-box-idle -n build
          | awk 'NR > 1 && $1 !~ /^\[/ && $1 !~ /^selfsubject/'
      register: perms
      changed_when: false
      check_mode: false
      failed_when: >-
        perms.rc != 0
        or perms.stdout_lines | length != 2
        or perms.stdout_lines | reject('search', '^statefulsets\\.apps(/scale)?\\s.*\\[rust-box\\]') | list | length > 0

    - name: Desde su namespace no se llega a cac ni al API, y sí a internet
      ansible.builtin.shell:
        cmd: >-
          kubectl -n build run netcheck-{{ 99999 | random }} --rm -i --restart=Never --quiet
          --image=busybox:1.37 --command -- sh -c '
          for t in postgres-rw.data:5432 valkey.data:6379 cac-service.cac:80 livekit-redis.cac:6379 kubernetes.default:443; do
            h=${t%:*}; p=${t#*:};
            if nc -z -w 3 $h $p; then echo "ABIERTO $t"; else echo "cerrado $t"; fi;
          done;
          if wget -q -T 10 -O /dev/null https://api.github.com; then echo "internet ok"; else echo "SIN internet"; fi'
      register: net
      changed_when: false
      check_mode: false
      failed_when: net.rc != 0 or 'ABIERTO' in net.stdout or 'internet ok' not in net.stdout

    - name: Estado
      ansible.builtin.command: kubectl -n build get statefulset,pods,pvc,cronjob,resourcequota
      register: state
      changed_when: false
      check_mode: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ net.stdout_lines + state.stdout_lines }}"

name: rust-box image

# La imagen de la caja de compilación de gstd (`infra/build-box/`). Sólo
# publica la imagen: ponerla en la caja es subir `build_box_image` en la
# config del servidor y aplicar el playbook `build-box`.
on:
  push:
    branches: [main]
    paths:
      - "infra/build-box/**"
      - ".github/workflows/rust-box.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Fecha y sha, como la imagen del runner: una etiqueta que no se mueve,
      # para que lo que corre en gstd sea lo que dice su config.
      - name: Tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: infra/build-box
          push: true
          tags: ghcr.io/g-studio-labs/cac-rust-box:${{ steps.tag.outputs.tag }}

name: desktop

# Las pruebas de la app de escritorio nativa (`desktop/`, en GPUI).
#
# Corren sin pantalla: el arnés de GPUI abre ventanas de mentira y les manda
# clics y teclado de verdad. Lo que no cubren —cómo se pinta, el método de
# entrada del sistema— se mira a mano.
#
# En cualquier rama, no sólo en `main`: la app nueva se construye en una rama
# hasta su primera entrega, y un verde que sólo existe tras fusionar llega
# tarde.
on:
  push:
    paths:
      - "desktop/**"
      - "core/**"
      # «Conectar Claude Code» instala `cac-mcp` con la lógica de `mcp/`.
      - "mcp/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  # Para `desktop-release.yml`: las mismas pruebas, por delante de empaquetar.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      # Lo que GPUI enlaza en Linux. La lista vive en un script porque es la
      # misma con la que se construye el instalador (`desktop-release.yml`).
      - name: System libraries
        run: bash packaging/linux/install-build-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./desktop -> target"

      - name: Test
        run: cargo test --locked

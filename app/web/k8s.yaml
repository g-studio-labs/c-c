# La versión web de cac en https://cac.guz-studio.dev/app (W1).
#
# Un Deployment propio y una HTTPRoute propia, y no una regla más en la del
# backend: así desplegar la web no toca el backend ni al revés. El Gateway
# junta las dos rutas del mismo host y gana el prefijo más largo, así que
# /app va aquí y todo lo demás (/api, /webhooks…) sigue en cac-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cac-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cac-web
  template:
    metadata:
      labels:
        app: cac-web
    spec:
      containers:
        - name: web
          image: ghcr.io/g-studio-labs/c-c/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cac-web
spec:
  selector:
    app: cac-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cac-web-route
spec:
  parentRefs:
    - name: gateway-api
      namespace: default
  hostnames:
    - "cac.guz-studio.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: cac-web
          port: 80
    # La raíz del dominio lleva a la web. Sin esto caía en la ruta del backend
    # (su `PathPrefix /`) y contestaba 404: quien escribe sólo el dominio —un
    # revisor de AWS, por ejemplo— veía un error. Exact gana a ese prefijo, así
    # que no toca nada más del backend. Temporal (302): si un día la raíz sirve
    # otra cosa, ningún navegador se queda con la redirección guardada.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /app/
            statusCode: 302
    # Las rutas de la web sin `/app` (`/tasks?doc=…`) van al nginx de la web,
    # que las manda a la misma bajo `/app` con su consulta (ver nginx.conf).
    # Así eran las ligas antes de mover la web a /app, y así las daba el MCP
    # hasta command-and-control-508: las ya escritas en comentarios, páginas y
    # mensajes siguen abriendo. Una sola regla con muchas rutas y no una regla
    # con su redirección por ruta: una HTTPRoute admite 16 reglas. La prueba
    # `TestEveryWebRouteWithoutAppLeadsToIt` exige las de `App.tsx`.
    - matches:
        - path:
            type: PathPrefix
            value: /activity
        - path:
            type: PathPrefix
            value: /call
        - path:
            type: PathPrefix
            value: /chat
        - path:
            type: PathPrefix
            value: /crypto
        - path:
            type: PathPrefix
            value: /dashboard
        - path:
            type: PathPrefix
            value: /devtools
        - path:
            type: PathPrefix
            value: /diagnostics
        - path:
            type: PathPrefix
            value: /dm
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /download
        - path:
            type: PathPrefix
            value: /feedback
        - path:
            type: PathPrefix
            value: /image-tool
        - path:
            type: PathPrefix
            value: /invitations
        - path:
            type: PathPrefix
            value: /join
        - path:
            type: PathPrefix
            value: /login
        - path:
            type: PathPrefix
            value: /my-work
        - path:
            type: PathPrefix
            value: /notes
        - path:
            type: PathPrefix
            value: /organization
        - path:
            type: PathPrefix
            value: /overview
        - path:
            type: PathPrefix
            value: /profile
        - path:
            type: PathPrefix
            value: /reports
        - path:
            type: PathPrefix
            value: /requests
        - path:
            type: PathPrefix
            value: /reset-password
        - path:
            type: PathPrefix
            value: /servers
        - path:
            type: PathPrefix
            value: /tasks
        - path:
            type: PathPrefix
            value: /users
        - path:
            type: PathPrefix
            value: /welcome
      backendRefs:
        - name: cac-web
          port: 80
